name: merlin
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: merlin:${APP_VERSION:-local}
    command: ["python", "-m", "workspace.cli", "--workspace", "/state", "serve", "--bind", "0.0.0.0"]
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      APP_BIND: 0.0.0.0
      APP_PORT: "${APP_PORT:-8711}"
      APP_TLS_CERT: "${APP_TLS_CERT:-}"
      APP_TLS_KEY: "${APP_TLS_KEY:-}"
      APP_PEER_CA_BUNDLE: "${APP_PEER_CA_BUNDLE:-}"
      CONTAINERIZED: "1"
    ports:
      - "${HOST_BIND:-127.0.0.1}:${APP_PORT:-8711}:${APP_PORT:-8711}"
    networks:
      team:
        aliases: [merlin]
    volumes:
      - ./state:/state
      - ./tls:/tls:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1536m
    init: true
    restart: "no"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import http.client, json, os, sqlite3, ssl
          from urllib.parse import urlsplit
          db = sqlite3.connect('file:/state/workspace.db?mode=ro', uri=True)
          row = db.execute("SELECT value FROM settings WHERE key='config'").fetchone()
          db.close()
          origin = urlsplit(json.loads(row[0])['origin'])
          client = (http.client.HTTPSConnection('127.0.0.1', int(os.environ['APP_PORT']), context=ssl._create_unverified_context()) if os.environ.get('APP_TLS_CERT') else http.client.HTTPConnection('127.0.0.1', int(os.environ['APP_PORT'])))
          client.request('GET', '/api/session', headers={'Host': origin.netloc})
          response = client.getresponse()
          assert response.status == 200
          response.read()
          client.close()
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
networks:
  team:
    name: cptc-team-workspace
    external: true
