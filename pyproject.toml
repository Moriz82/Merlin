[project]
name = "merlin-workspace"
version = "0.1.0a1"
description = "Public source for a local, human-operated competition writing workspace"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "python-multipart==0.0.32",
    "defusedxml==0.7.1",
    "cryptography==50.0.1",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "markdown-it-py==4.2.0",
]
[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]
[project.scripts]
merlin = "workspace.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["workspace"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
